# Render: Background Worker (polling bot — no web port needed)
# 1. Push this folder to GitHub
# 2. Render dashboard > New > Background Worker > pick the repo
# 3. Build: pip install -r requirements.txt
#    Start: python bot.py
# 4. Set env vars in Render (see README.md). Free tier workers sleep
#    after inactivity on some plans — for a busy group use a paid
#    instance, or Railway / Fly.io instead.
services:
  - type: worker
    name: telegram-group-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RESPOND_MODE
        value: mention_only
